<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Masuk Admin — IndoTrip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <main class="auth-main auth-main--admin">
    <section class="auth-hero" aria-labelledby="admin-login-title">
      <div class="auth-hero-inner auth-container auth-hero-inner--admin">

        <div class="auth-card-wrap auth-card-wrap--admin">
          <div class="auth-card">
            <div class="auth-brand" aria-label="IndoTrip">
              <span class="auth-brand-icon">
                <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                  <circle cx="16" cy="16" r="12.4" stroke="currentColor" stroke-width="2.4" />
                  <path d="M21.6 10.4 18.2 18.2 10.4 21.6 13.8 13.8 21.6 10.4Z" fill="currentColor" />
                </svg>
              </span>
              <span class="auth-brand-name">Indo<span>Trip</span></span>
            </div>

            <span class="admin-login-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
                <path d="m9 12 2 2 4-4" />
              </svg>
              Akses Panel Admin
            </span>

            <h2 class="auth-card-title" id="admin-login-title">Masuk Panel Admin</h2>
            <p class="auth-card-sub">Gunakan akun admin IndoTrip untuk mengelola verifikasi pembayaran dan pesan traveller.</p>

            <form id="adminLoginForm" class="auth-form" novalidate>
              <div class="auth-field">
                <label for="adminLoginEmail">Email Admin</label>
                <input id="adminLoginEmail" name="email" type="email" placeholder="admin@indotrip.id" autocomplete="username" required />
              </div>

              <div class="auth-field">
                <label for="adminLoginPassword">Password Admin</label>
                <div class="auth-input-icon">
                  <input id="adminLoginPassword" name="password" type="password" placeholder="Masukkan password admin" autocomplete="current-password" required />
                  <button type="button" class="auth-eye js-toggle-password" aria-label="Tampilkan password" aria-pressed="false">
                    <svg class="eye-open" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M3 3l18 18" />
                      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                      <path d="M9.9 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.2 6.3A17.6 17.6 0 0 0 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.1-.8" />
                    </svg>
                  </button>
                </div>
              </div>

              <p class="auth-message" id="adminLoginMessage" role="alert" hidden></p>

              <button type="submit" class="auth-primary-btn">
                Masuk ke Panel Admin
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </button>
            </form>

            <p class="auth-switch auth-switch--home">
              <a href="index.html">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m12 19-7-7 7-7M19 12H5" />
                </svg>
                Kembali ke Beranda
              </a>
            </p>
          </div>
        </div>

      </div>
    </section>
    <div class="auth-spacer" aria-hidden="true"></div>
  </main>

  <script>
  (function () {
    "use strict";

    var AUTH_API = "api/auth.php";
    var ADMIN_URL = "admin.html";

    function showMessage(element, text, type) {
      if (!element) return;
      element.textContent = text;
      element.className = "auth-message auth-message--" + (type || "error");
      element.hidden = false;
    }

    function clearMessage(element) {
      if (!element) return;
      element.textContent = "";
      element.hidden = true;
    }

    function setBusy(button, busy) {
      if (button) button.disabled = busy;
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
    }

    /** Semua request auth memakai cookie session yang sama (same-origin). */
    function authRequest(action, options) {
      var opts = options || {};
      var isPost = String(opts.method || "GET").toUpperCase() === "POST";
      var headers = { "Accept": "application/json" };
      if (isPost) headers["Content-Type"] = "application/json";

      return fetch(AUTH_API + "?action=" + encodeURIComponent(action), {
        method: isPost ? "POST" : "GET",
        credentials: "same-origin",
        headers: headers,
        body: isPost ? JSON.stringify(opts.body || {}) : undefined
      }).then(function (response) {
        return response.json().catch(function () { return null; }).then(function (payload) {
          return {
            ok: response.ok,
            status: response.status,
            payload: payload && typeof payload === "object" ? payload : null
          };
        });
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      /* Tombol tampil/sembunyikan password. */
      var toggle = document.querySelector("#adminLoginForm .js-toggle-password");
      if (toggle) {
        var wrapper = toggle.closest(".auth-input-icon");
        var pwd = wrapper ? wrapper.querySelector("input") : null;
        if (pwd) {
          toggle.addEventListener("click", function () {
            var show = pwd.type === "password";
            pwd.type = show ? "text" : "password";
            toggle.setAttribute("aria-pressed", show ? "true" : "false");
            toggle.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
          });
          toggle.classList.toggle("is-visible", false);
        }
      }

      authRequest("admin_me").then(function (result) {
        if (result.ok && result.payload && result.payload.success === true && result.payload.data) {
          window.location.replace(ADMIN_URL);
        }
      }).catch(function () {
        /* Biarkan form tampil bila pengecekan gagal. */
      });

      var form = document.getElementById("adminLoginForm");
      if (!form) return;

      var emailInput = document.getElementById("adminLoginEmail");
      var passwordInput = document.getElementById("adminLoginPassword");
      var message = document.getElementById("adminLoginMessage");
      var submitBtn = form.querySelector('button[type="submit"]');

      [emailInput, passwordInput].forEach(function (input) {
        if (input) input.addEventListener("input", function () { clearMessage(message); });
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessage(message);

        var email = emailInput ? emailInput.value.trim() : "";
        var password = passwordInput ? passwordInput.value : "";

        if (!email || !password) {
          showMessage(message, "Lengkapi email dan password admin terlebih dahulu.");
          return;
        }
        if (!isValidEmail(email)) {
          showMessage(message, "Format email tidak valid. Contoh: nama@email.com");
          return;
        }

        setBusy(submitBtn, true);

        authRequest("admin_login", {
          method: "POST",
          body: { email: email, password: password }
        }).then(function (result) {
          var payload = result.payload;
          if (!result.ok || !payload || payload.success !== true) {
            var error = new Error(
              (payload && (payload.error || payload.message)) ||
              "Tidak dapat terhubung ke server. Silakan coba lagi."
            );
            error.status = result.status;
            throw error;
          }
          window.location.href = ADMIN_URL;
        }).catch(function (error) {
          showMessage(
            message,
            (error && error.message) || "Gagal masuk sebagai admin. Silakan coba lagi.",
            "error"
          );
          setBusy(submitBtn, false);
        });
      });
    });
  })();
  </script>
</body>
</html>
